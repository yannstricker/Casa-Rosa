site_name: Casa Rosa
site_description: Informationen für unsere Gäste
site_url: https://yannstricker.github.io/Casa-Rosa/

theme:
  name: material
  font:
    text: Roboto
    
  language: de
  custom_dir: docs/overrides
  palette:
    primary: blue
    accent: light blue

plugins:
  - search
  - glightbox
  
nav:
  - Panoramica: index.md
  - Reservationen: belegung.md
  - Infos zur Wohnung: wohnung.md
  - Ankunft & Abreise: ankunft-abreise.md
  - Ausflugsideen & Tipps: ausfluege-tipps.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - toc:
      permalink: true